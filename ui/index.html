<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro Bar</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root">
  <div class="bar-row" id="barRow">
    <button class="round grip" id="grip" title="Move Maestro" aria-label="Move Maestro"></button>
    <div class="pill" id="pill">
      <div class="status" id="status"></div>
      <div class="pill-actions" id="pillActions"></div>
    </div>
    <button class="round close" id="close" title="Hide Maestro" aria-label="Hide Maestro"></button>
  </div>

  <div class="panel" id="panel">
    <div class="panel-inner">
      <div class="content">
        <div class="scroll" id="scroll"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="composer">
        <div class="box" id="box">
          <div class="field">
            <textarea id="input" rows="1" spellcheck="true" aria-label="Message"></textarea>
            <div class="ph" id="ph"></div>
          </div>
          <div class="tools">
            <div class="tools-left" id="toolsLeft"></div>
            <button class="send" id="send" title="Send" aria-label="Send"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
